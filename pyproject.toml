[project]
name = "applesearch"
version = "0.1.0"
description = "A small, local-first Quickshell Spotlight with EmbeddingGemma 2"
requires-python = ">=3.11,<3.15"
dependencies = [
    "sentence-transformers[image]==6.1.0",
    "transformers==5.20.0",
    "torch>=2.9,<3",
    "torchvision>=0.24,<1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
